services:
  mysql:
    image: mysql:8.4
    container_name: gos-mysql-prod
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: gos_release
      MYSQL_USER: gos
      MYSQL_PASSWORD: ${GOS_MYSQL_PASSWORD:?set GOS_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${GOS_MYSQL_ROOT_PASSWORD:?set GOS_MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - gos_mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gos-backend-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      GOS_ENVIRONMENT: production
      GOS_DB_DRIVER: mysql
      GOS_MYSQL_DSN: "gos:${GOS_MYSQL_PASSWORD:?set GOS_MYSQL_PASSWORD}@tcp(mysql:3306)/gos_release?charset=utf8mb4&parseTime=true&loc=UTC"
      GOS_AUTH_ADMIN_PASSWORD: ${GOS_AUTH_ADMIN_PASSWORD:?set GOS_AUTH_ADMIN_PASSWORD}
      GOS_SECURITY_ENCRYPTION_KEY: ${GOS_SECURITY_ENCRYPTION_KEY:?set GOS_SECURITY_ENCRYPTION_KEY}
    volumes:
      - ./configs/config.docker.prod.json:/app/configs/config.docker.json:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: gos-frontend-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"

volumes:
  gos_mysql_prod_data:

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: gos
    metrics_path: /metrics
    scrape_timeout: 10s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/gos-metrics-token
    static_configs:
      # Replace with the address reachable from your Prometheus network.
      - targets: ["gos-release:8081"]

# Configure the existing Alertmanager under alerting.alertmanagers to send alerts.
